[build]
  publish = "."

[functions]
  node_bundler = "esbuild"

# Preserve the existing /api/* routes by proxying them to the Netlify Function.
# status = 200 (proxy rewrite) keeps the /api/* URL in the browser while the
# function serves the existing Express routes unchanged.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA Fallback: Route all other requests to index.html so the frontend router can handle them
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
